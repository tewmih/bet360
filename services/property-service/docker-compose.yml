services:
  postgres:
    image: postgres:15-alpine
    container_name: bet360-property-postgres
    environment:
      POSTGRES_USER: bet360_user
      POSTGRES_PASSWORD: bet360_password
      POSTGRES_DB: bet360_property_db
    ports:
      - "5435:5432"
    volumes:
      - property_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet360_user -d bet360_property_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
volumes:
  property_postgres_data: